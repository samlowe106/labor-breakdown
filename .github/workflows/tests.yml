name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      # uv reads .python-version and pyproject.toml's dev group itself.
      - name: Run tests
        run: uv run --group dev pytest --verbose
